name: glp1search-mcp
displayName: GLP1Search
description: |-
  Search 24,000+ verified GLP-1 telehealth clinics and medspas, compare
  semaglutide (Ozempic, Wegovy, Rybelsus), tirzepatide (Mounjaro, Zepbound),
  liraglutide (Saxenda, Victoza), and 90+ peptides. Includes real pricing,
  full dosing schedules, side effects, contraindications, FAQs, and 32
  treated conditions. Sourced from GLP1Search.com.

homepage: https://www.glp1search.com
repository: https://github.com/Sndevore77/glp1search-mcp
license: MIT
icon: https://www.glp1search.com/favicon.svg

tags:
  - healthcare
  - weight-loss
  - glp-1
  - semaglutide
  - tirzepatide
  - ozempic
  - wegovy
  - mounjaro
  - zepbound
  - peptides
  - directory
  - medical
  - telehealth
  - medspa

categories:
  - health
  - research

startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |-
    (config) => ({ command: 'node', args: ['index.js'] })

# Tools exposed (for Smithery's tool listing UI)
tools:
  - name: search_providers
    description: Search 24,000+ GLP-1 providers by name, location, type, or medication.
  - name: get_provider
    description: Get full details for a specific provider including pricing, ratings, and contact info.
  - name: compare_providers
    description: Side-by-side comparison of 2-3 GLP-1 providers.
  - name: get_medication_info
    description: Detailed info on a GLP-1 medication — dosing, side effects, cost, contraindications.
  - name: list_medications
    description: All GLP-1 medications with key stats.
  - name: compare_medications
    description: Side-by-side medication comparison (e.g. semaglutide vs tirzepatide).
  - name: get_side_effect_info
    description: Full details on any GLP-1 side effect — frequency, management, when to seek help.
  - name: find_cheapest_providers
    description: Lowest-cost GLP-1 providers in a state or city.
  - name: get_faq
    description: Search 193 curated FAQs about GLP-1 medications and weight loss.
  - name: get_peptide_info
    description: Detailed info on any of 90+ peptides (BPC-157, TB-500, Ipamorelin, etc.).
  - name: list_peptides
    description: All peptides organized by category.
